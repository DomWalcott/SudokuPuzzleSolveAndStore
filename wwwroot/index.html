    <script>

        // looping through the div ids to get the content of the divs, turning it into a jagged array for JSON
        async function MakeJaggedArrayAndFetch() {
            var numbersForSolving = [[], [], [], [], [], [], [], [], []];
            var input;

            for (let i = 0; i < 81; i++) {

                input = document.getElementById(i).value;
                input = Number(input);
                //checks that the input is an int between 0 and 9
                if (!checkValidNumber(i)) {
                    return;
                }
                else if (i < 9) {
                    numbersForSolving[0][i] = input;
                }
                else if (i > 8 && i < 18) {
                    numbersForSolving[1][i % 9] = input;
                }
                else if (i > 17 && i < 27) {
                    numbersForSolving[2][i % 9] = input;
                }
                else if (i > 26 && i < 36) {
                    numbersForSolving[3][i % 9] = input;
                }
                else if (i > 35 && i < 45) {
                    numbersForSolving[4][i % 9] = input;
                }
                else if (i > 44 && i < 54) {
                    numbersForSolving[5][i % 9] = input;
                }
                else if (i > 53 && i < 63) {
                    numbersForSolving[6][i % 9] = input;
                }
                else if (i > 62 && i < 72) {
                    numbersForSolving[7][i % 9] = input;
                }
                else if (i > 71 && i < 81) {
                    numbersForSolving[8][i % 9] = input;
                }
            }
            const solvedPuzzle = await sendToApi(numbersForSolving);
            fillSolvedGrid(solvedPuzzle);
            document.getElementById("resultsGrid").hidden = false;
        }

        //checks its an int between 0 and 9
        function checkValidNumber(numberIn) {
        let intIn = Number(document.getElementById(numberIn).value);

            if (intIn == "NaN" || intIn > 9 || intIn < 0) {
                window.alert("please enter a whole number between 0 and 9");
                return false;
            }
            if (!Number.isInteger(intIn)) {
                window.alert("please enter a whole number between 0 and 9");
                return false;
            }
            else {
                return true;
            }
        }
        // fetching from API
        async function sendToApi(numbersForSolving) {
            const response = await fetch("/api/sudokusolver",{
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ unsolvedPuzzle: numbersForSolving })
             });
            if (!response.ok) {
                const errorMessage = await response.text();
                throw new Error(`API returned ${response.status}: ${errorMessage}`);
            }
            const puzzleResponse = await response.json();
            return puzzleResponse.solvedPuzzle;
        }
